name: rift_app
description: >-
  Riftmark — Android-клиент. Flutter (UI/UX) + Flame (боевая сцена) поверх
  чистого Dart-ядра из пакета `rift`. Ни одной игровой формулы здесь нет:
  вся математика живёт в ядре и остаётся headless-тестируемой.
publish_to: none
version: 0.10.0+11

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Переводы системных виджетов Flutter: подписи в диалогах, меню выделения
  # текста, подсказки прокрутки. Без него они остаются английскими на любом
  # языке игры — заметно ровно в русской сборке.
  flutter_localizations:
    sdk: flutter

  # Ядро симуляции. Чистый Dart, без Flutter — подключено по пути,
  # чтобы правка баланса не требовала публикации пакета.
  rift:
    path: ..

  # Боевая сцена (Фаза 5). Подключён сразу, чтобы зафиксировать
  # совместимость версий, но пока используется в одном дев-экране.
  flame: ^1.36.0

  # Аналитика (docs/11-ANALYTICS.md). Firebase выбран не за отчёты — они у
  # него маркетинговые, — а за две вещи, которых нет у сырого протокола GA4:
  # события переживают офлайн на диске и выгружаются пачкой, и бесплатный
  # выгруз в BigQuery отдаёт СЫРЫЕ строки, на которых только и считается
  # баланс. Игра запускается и без ключей: `AnalyticsSetup` это переживает.
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0

  # Сейв: каталог документов + атомарная запись (02-TECH §4).
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  audioplayers: ^6.7.1
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Зеркало ./../assets/content. Flutter не умеет брать ассеты выше корня
    # пакета, поэтому контент синхронизируется скриптом:
    #   dart run tool/sync_content.dart
    - assets/content/
    - assets/content/en/

    # Звуки синтезируются кодом: `dart run tool/make_sounds.dart` из корня
    # репозитория. Источник — генератор, а не эти файлы.
    - assets/audio/
